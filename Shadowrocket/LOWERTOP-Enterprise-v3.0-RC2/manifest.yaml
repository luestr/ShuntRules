    path: rule/Shadowrocket/Telegram/Telegram.list
    policy: Telegram
    stage: 50
    audit: {min_rules: 10, max_rules: 5000, max_bytes: 5000000, require_commit_pin: true}
  - name: YouTube
    path: rule/Shadowrocket/YouTube/YouTube.list
    policy: YouTube
    stage: 60
    audit: {min_rules: 50, max_rules: 10000, max_bytes: 10000000, require_commit_pin: true}
  - name: Netflix
    path: rule/Shadowrocket/Netflix/Netflix.list
    policy: Netflix
    stage: 61
    audit: {min_rules: 50, max_rules: 10000, max_bytes: 10000000, require_commit_pin: true}
  - name: Disney
    path: rule/Shadowrocket/Disney/Disney.list
    policy: Disney+
    stage: 62
    audit: {min_rules: 20, max_rules: 10000, max_bytes: 10000000, require_commit_pin: true}
  - name: HBO
    path: rule/Shadowrocket/HBO/HBO.list
    policy: MAX
    stage: 63
    audit: {min_rules: 10, max_rules: 10000, max_bytes: 10000000, require_commit_pin: true}
  - name: TikTok
    path: rule/Shadowrocket/TikTok/TikTok.list
    policy: TikTok
    stage: 66
    audit: {min_rules: 20, max_rules: 10000, max_bytes: 10000000, require_commit_pin: true}
  - name: Spotify
    path: rule/Shadowrocket/Spotify/Spotify.list
    policy: Spotify
    stage: 67
    audit: {min_rules: 20, max_rules: 10000, max_bytes: 10000000, require_commit_pin: true}
  - name: AdvertisingLite
    path: rule/Shadowrocket/AdvertisingLite/AdvertisingLite.list
    policy: REJECT
    stage: 70
    audit: {min_rules: 300, max_rules: 1000, max_bytes: 30000000, require_commit_pin: true}
  - name: Lan
    path: rule/Shadowrocket/Lan/Lan.list
    policy: DIRECT
    stage: 80
    audit: {min_rules: 10, max_rules: 5000, max_bytes: 5000000, require_commit_pin: true}
  - name: ChinaMax
    path: rule/Shadowrocket/ChinaMax/ChinaMax.list
    policy: DIRECT
    stage: 90
    audit: {min_rules: 10000, max_rules: 20000, max_bytes: 60000000, require_commit_pin: true}

final_rule: FINAL,PROXY

intentional_overrides:
  - higher: DOMAIN,captive.apple.com,DIRECT
    lower: DOMAIN-SUFFIX,apple.com,DIRECT
    reason: 公共 Wi-Fi 启动认证必须最先明确处理

health_checks:
  - id: openai_web
    service: OpenAI Web
    policy: AI
    url: https://chatgpt.com
    method: GET
    healthy_status: [200, 301, 302]
    warning_status: [403, 429]
    timeout: 12
    max_latency_ms: 6000
  - id: telegram_web
    service: Telegram Web
    policy: Telegram
    url: https://telegram.org
    method: GET
    healthy_status: [200, 301, 302]
    warning_status: [403, 429]
    timeout: 12
    max_latency_ms: 5000
  - id: apple_success
    service: Apple Core
    policy: DIRECT
    url: https://www.apple.com/library/test/success.html
    method: GET
    healthy_status: [200]
    warning_status: []
    body_contains: Success
    timeout: 12
    max_latency_ms: 5000
  - id: youtube_204
    service: YouTube
    policy: YouTube
    url: https://www.youtube.com/generate_204
    method: GET
    healthy_status: [204]
