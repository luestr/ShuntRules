local_rulesets:
  - {name: Probe-Proxy, file: rules/Probe-Proxy.list, policy: PROXY, stage: 10}
  - {name: OpenAI-AI, file: rules/OpenAI-AI.list, policy: AI, stage: 20}
  - {name: Apple-Global-AI, file: rules/Apple-Global-AI.list, policy: AI, stage: 30}
  - {name: Apple-Core-Direct, file: rules/Apple-Core-Direct.list, policy: DIRECT, stage: 40}

inline_rules:
  - rule: DOMAIN,captive.apple.com,DIRECT
    stage: 0
    comment: 公共 Wi-Fi 门户认证例外
  - {rule: 'DOMAIN-SUFFIX,litix.io,MAX', stage: 65}
  - {rule: 'DOMAIN-SUFFIX,discomax.com,MAX', stage: 65}
  - {rule: 'DOMAIN-SUFFIX,brightline.tv,MAX', stage: 65}

remote_rulesets:
