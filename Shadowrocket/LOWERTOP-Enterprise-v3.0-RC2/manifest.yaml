    members: [PROXY, 媒体, 香港节点, 日本节点, 台湾节点, 新加坡节点, 韩国节点, 美国节点]
    params: {policy-select-name: PROXY}
  - name: MAX
    type: select
    members: [PROXY, 媒体, 香港节点, 日本节点, 台湾节点, 新加坡节点, 韩国节点, 美国节点]
